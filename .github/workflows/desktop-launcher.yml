name: Launcher builds

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: launcher-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onion:
    name: Pinned Onion ARM build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Cross-build device diagnostic
        shell: pwsh
        run: ./tools/build-onion.ps1 -Action build

  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Configure, build, and test
        shell: powershell
        run: .\tools\dev.ps1 -Action test
